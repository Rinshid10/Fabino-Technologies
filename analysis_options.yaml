include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Needed for json_serializable annotations on freezed factories.
    invalid_annotation_target: ignore

linter:
  rules:
    # This is an app, not a published library.
    public_member_api_docs: false
